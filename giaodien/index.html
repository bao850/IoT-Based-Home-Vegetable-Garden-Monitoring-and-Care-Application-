<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đăng nhập</title>
  <link rel="stylesheet" href="login.css" />
</head>
<body>

  <!-- ================== AUTO REDIRECT ================== -->
  <script>
    if (
      localStorage.getItem("smartgarden_login") === "true" ||
      sessionStorage.getItem("smartgarden_login") === "true"
    ) {
      window.location.href = "datn.html";
    }
  </script>

  <div class="login-container">
    <h2>Đăng nhập</h2>

    <div class="input-group">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="Nhập email..." autocomplete="username" />
    </div>

    <div class="input-group password-group">
      <label for="password">Mật khẩu</label>
      <input type="password" id="password" placeholder="Nhập mật khẩu..." autocomplete="current-password" />
      <span class="toggle-password" onclick="togglePass()">👁</span>
    </div>

    <button class="btn-login" id="login-btn">Đăng nhập</button>

    <p class="register-text">
      Chưa có tài khoản?
      <!-- ❗️ KO để href="#" vì reload lại trang -->
      <a href="register.html" id="register">Đăng ký</a>
    </p>

    <div class="remember-me">
      <input type="checkbox" id="remember" />
      <label for="remember">Ghi nhớ đăng nhập</label>
    </div>

    <div id="error-box" class="error-box"></div>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>

  <script>
    // Show/Hide Password
    function togglePass() {
      const pass = document.getElementById("password");
      pass.type = pass.type === "password" ? "text" : "password";
    }
  </script>

  <script src="login.js"></script>

</body>
</html>
